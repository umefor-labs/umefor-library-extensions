name: Build Extension Index

on:
  push:
    branches:
      - main
    paths:
      - 'extensions/**'
      - 'scripts/build_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild index.json
        run: python3 scripts/build_index.py

      - name: Commit updated index.json
        run: |
          git config user.name "umefor-bot"
          git config user.email "bot@umefor.local"
          git add index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: rebuild extension index.json"
            git push
          else
            echo "No changes to index.json"
          fi
